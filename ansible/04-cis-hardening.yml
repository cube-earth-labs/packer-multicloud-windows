---
# Mirrors packer/scripts/04-cis-hardening.ps1
#
# This is the playbook to replace with your existing hardening role.
# The value of the demo is that it plugs in HERE, unchanged - the baseline
# runs once against a clean base image instead of repeatedly against live VMs,
# so idempotency stops being a prerequisite.

- name: Apply the CIS Windows Server 2022 L1 baseline
  hosts: all
  gather_facts: false

  tasks:
    - name: Enforce password and lockout policy
      community.windows.win_security_policy:
        section: System Access
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop:
        - {key: MinimumPasswordLength, value: 14}
        - {key: PasswordComplexity, value: 1}
        - {key: LockoutBadCount, value: 5}
        - {key: MaximumPasswordAge, value: 365}

    - name: Remove the SMBv1 feature entirely
      ansible.windows.win_optional_feature:
        name: SMB1Protocol
        state: absent

    - name: Disable legacy TLS and SSL protocols
      ansible.windows.win_regedit:
        path: >-
          HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\{{ item }}\Server
        name: Enabled
        data: 0
        type: dword
      loop:
        - SSL 2.0
        - SSL 3.0
        - TLS 1.0
        - TLS 1.1

    - name: Require SMB signing
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: RequireSecuritySignature
        data: 1
        type: dword

    - name: Enable LSA protection
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: RunAsPPL
        data: 1
        type: dword

    - name: Enable the firewall on all three profiles
      ansible.windows.win_firewall:
        profiles: [Domain, Private, Public]
        state: enabled

    - name: Enable advanced audit policy for logon events
      ansible.windows.win_audit_policy_system:
        subcategory: "{{ item }}"
        audit_type: success, failure
      loop:
        - Logon
        - Logoff
        - Account Lockout
        - Special Logon
